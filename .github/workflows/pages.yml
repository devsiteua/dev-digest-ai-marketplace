name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; let a running one finish so a live deploy is
# never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the catalog index
        run: npm run build:index

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      # `enablement: true` turns Pages on for the repository on the first run.
      # Without it the action fails with "Get Pages site failed ... Not Found"
      # on a repository where Pages has never been configured — which is what
      # happened on the first push to main. Doing it here rather than by hand in
      # the settings UI keeps the deploy reproducible from the repository alone.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
